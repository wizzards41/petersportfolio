<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8be9fd"/>
      <stop offset="100%" stop-color="#bd93f9"/>
    </linearGradient>
  </defs>

  <!-- orbit ring -->
  <ellipse cx="16" cy="16" rx="14" ry="6"
           fill="none" stroke="url(#logoGrad)" stroke-width="1.4"
           transform="rotate(-25 16 16)" opacity="0.85"/>

  <!-- planet core -->
  <circle cx="16" cy="16" r="7.5" fill="url(#logoGrad)"/>

  <!-- small orbiting star -->
  <circle cx="27" cy="10" r="1.6" fill="#f1fa8c"/>
  <circle cx="4.5" cy="22" r="1.1" fill="#ffffff" opacity="0.8"/>
</svg>
